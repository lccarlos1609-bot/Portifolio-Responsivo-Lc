<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Retro VCR</title>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        background-color: #000;
        overflow-x: hidden;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
    }

    ::-webkit-scrollbar {
        display: none;
    }

    .slide-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        scroll-snap-align: start;
        background-color: #0d0d0d;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* DESKTOP: Mantém o layout original fluido */
    .bg-image {
        width: 100%;
        height: 100%;
        object-fit: fill;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }

    .media-overlay {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-end;
        gap: 15px;
        width: 90%;
        max-width: 1300px;
    }

    .media-overlay video,
    .media-overlay img {
        border-radius: 1rem;
        border: 2px solid #ffffff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        object-fit: cover;
        background-color: #000;
        width: clamp(140px, 14vw, 200px);
        height: auto;
        aspect-ratio: 9 / 16;
    }

    .media-overlay.large-items video,
    .media-overlay.large-items img {
        width: clamp(170px, 18vw, 260px);
    }

    /* ======================================================
       REGRAS EXCLUSIVAS PARA CELULAR (SOLUÇÃO DO CORTE)
       ====================================================== */
    @media (max-width: 768px) {
        .slide-container {
            height: 100vh;
            overflow-y: auto; /* Permite rolar a prancheta no celular sem cortar nada */
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #1a1a1a;
        }

        /* A imagem da prancheta encaixa 100% da largura sem cortar a palavra 'PROJETOS' */
        .bg-image {
            position: relative;
            width: 100%;
            height: auto;
            max-height: 35vh; /* Ocupa só a parte superior */
            object-fit: contain;
            background-color: #000;
        }

        /* Os cards entram logo abaixo da imagem, sem invadir o título */
        .media-overlay {
            position: relative;
            transform: none;
            left: 0;
            bottom: 0;
            width: 100%;
            padding: 20px 10px 40px 10px;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .media-overlay video,
        .media-overlay img,
        .media-overlay.large-items video,
        .media-overlay.large-items img {
            width: calc(50% - 12px); /* Mantém 2 colunas organizadas */
            max-width: 180px;
            aspect-ratio: 9 / 16;
        }
    }

    @media (max-width: 400px) {
        .media-overlay video,
        .media-overlay img,
        .media-overlay.large-items video,
        .media-overlay.large-items img {
            width: 85%; /* 1 card por linha em telas muito pequenas */
            max-width: 240px;
        }
    }
    </style>
</head>

<body>

    <!-- PRANCHETA 1 -->
    <div class="slide-container">
        <img class="bg-image" src="Prancheta 1.jpg" alt="Capa">
    </div>

    <!-- PRANCHETA 2 -->
    <div class="slide-container">
        <img class="bg-image" src="Prancheta 2.jpg" alt="Sobre Mim">
    </div>

    <!-- PRANCHETA 3 -->
    <div class="slide-container">
        <img class="bg-image" src="Prancheta 3.jpg" alt="Habilidades">
    </div>

    <!-- PRANCHETA 4: PROJETOS -->
    <div class="slide-container">
        <img class="bg-image" src="Prancheta 4.jpg" alt="PROJETOS">
        <div class="media-overlay">
            <img id="foto2" src="PETISQUINHO.png" alt="Foto 2">
            <img id="foto3" src="BOBBY.jpg" alt="Foto 3">
            <img id="foto1" src="Sem Título-2-1.jpg" alt="Foto 1">
            <video controls autoplay muted loop id="video2">
                <source src="PETS.mp4" type="video/mp4">
            </video>
            <video controls autoplay muted loop id="bgvideo">
                <source src="PORQUE ELES DORMEM TANTO.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- PRANCHETA 5 -->
    <div class="slide-container">
        <img class="bg-image" src="prancheta-5.jpg" alt="Meus Projetos">
        <div class="media-overlay large-items">
            <video controls autoplay muted loop id="bgvideo2">
                <source src="TRABALHO FOCADO.mp4" type="video/mp4">
            </video>
            <img id="foto6" src="produtividade.jpg" alt="Foto 6">
            <video controls autoplay muted loop id="video3">
                <source src="SEU NOVO CYBER CAFÉ.mp4" type="video/mp4">
            </video>
            <img id="foto7" src="PARA-UMA-MELHOR-PERFORMANCE.jpg" alt="Foto 7">
        </div>
    </div>

    <!-- PRANCHETA 6 -->
    <div class="slide-container">
        <img class="bg-image" src="prancheta-6.jpg" alt="Meus Projetos 2">
        <div class="media-overlay">
            <video controls autoplay muted loop id="video4">
                <source src="VERDAC.mp4" type="video/mp4">
            </video>
            <img id="foto8" src="sim-é-possivel-trabalhar-em-um-ambiente-saudavel--FINAL.jpg" alt="Foto 8">
            <video controls autoplay muted loop id="video5">
                <source src="DEEP WORK  mp4.mp4" type="video/mp4">
            </video>
        </div>
    </div>

</body>
</html>
